[colors]
background = #000412
background-alt = #06133D
foreground = #E4E6ED
primary = #E4E6ED
accent = #a9a5c9
secondary = #8ABEB7
alert = #A54242
disabled = #707880

[bar/my_first_bar]
; Require the monitor to be in connected state
monitor-strict = false

font-0 = Noto Sans Mono:style=Regular
font-1 = Noto Sans Mono CJK JP:style=Regular:size=10
font-2 = Adwaita Mono Nerd Font:style=Regular:size=15;1

monitor-exact = true

; bottom = true

fixed-center = true

width = 100%
height = 24pt
offset-x = 0
offset-y = 0

background = ${colors.background}
foreground = ${colors.foreground}

radius = 0.0

line-size = 3
line-color = #f00

; Padding (number of spaces, pixels, or points) to add at the beginning/end of
; the bar
; Individual side values can be defined using:
;   padding-{left,right}
padding-right = 1

; Margin (number of spaces, pixels, or points) to add before/after each module
; Individual side values can be defined using:
;   module-margin-{left,right}
module-margin = 0

; Modules are added to one of the available blocks
;   modules-left = cpu ram
;   modules-center = xwindow xbacklight
;   modules-right = ipc clock
modules-left = workspaces
modules-center = date
modules-right = xkeyboard pulseaudio battery systray

; The separator will be inserted between the output of each module
; This has the same properties as a label
separator =

; This value is used to add extra spacing between elements
; @deprecated: This parameter will be removed in an upcoming version
spacing = 0

; Opacity value between 0.0 and 1.0 used on fade in/out
dim-value = 1.0

; Value to be used to set the WM_NAME atom
; If the value is empty or undefined, the atom value
; will be created from the following template: polybar-[BAR]_[MONITOR]
; NOTE: The placeholders are not available for custom values
wm-name =

; Locale used to localize various module data (e.g. date)
; Expects a valid libc locale, for example: sv_SE.UTF-8

locale = 
wm-restack = i3

; Whether polybar defines struts (_NET_WM_STRUT_PARTIAL and _NET_WM_STRUT)
; New in version 3.7.0
enable-struts = true

; Set a DPI values used when rendering text
; This only affects scalable fonts
; Set this to 0 to let polybar calculate the dpi from the screen size.
; dpi = 
dpi-x = 96
dpi-y = 96

; Enable support for inter-process messaging
; See the Messaging wiki page for more details.
enable-ipc = false

; If two clicks are received within this interval (ms), they are recognized as
; a double click.
; New in version 3.6.0
double-click-interval = 400


[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%


[module/battery]
type = internal/battery
low-at = 5
battery = BAT1
adapter = AC
poll-interval = 5

format-discharging = <ramp-capacity> <label-discharging>

label-full = 󰂄
label-charging = 󱐋
label-low = 󰂃

format-full-padding = 2
format-charging-padding-left = 2
format-low-padding-left = 2
format-discharging-padding = 2

ramp-capacity-0 = 󰁻
ramp-capacity-1 = 󰁿
ramp-capacity-2 = 󰁿
ramp-capacity-3 = 󰂁
ramp-capacity-4 = 󰁹


[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.accent}
format-volume = <label-volume>

label-volume = %percentage%%
label-volume-padding-right = 1

label-muted = muted
label-muted-foreground = ${colors.disabled}
label-muted-padding-right = 1


[module/network]
type = custom/text
content = %{A1:}
click-left = nm-connection-editor


[module/xkeyboard]
type = internal/xkeyboard
format = [ <label-layout> ]
format-margin = 2

label-layout = %layout%
label-layout-foreground = ${colors.accent}


[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S

label = %date%
label-foreground = ${colors.primary}


[module/workspaces]
type = internal/xworkspaces

label-foregroun = ${colors.accent}

icon-0 = 1;%{T1}一
icon-1 = 2;%{T1}二
icon-2 = 3;%{T1}三
icon-3 = 4;%{T1}四
icon-4 = 5;%{T1}五
icon-5 = 6;%{T1}六
icon-6 = 7;%{T1}七
icon-7 = 8;%{T1}八
icon-8 = 9;%{T1}九
icon-9 = 10;%{T1}十

pin-workspaces = true

label-active = %icon%
label-active-background = ${colors.background-alt}
label-active-foreground = ${colors.foreground}
label-active-padding = 1

label-occupied = %icon%
label-occupied-padding = 1

label-empty = %icon%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

label-urgent = %icon%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1


[module/systray]
type = internal/tray

format-margin = 8pt
tray-spacing = 2pt
