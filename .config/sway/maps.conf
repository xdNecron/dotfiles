set $mod Mod4
floating_modifier $mod

# start a terminal
bindsym --to-code $mod+t exec ghostty
bindsym --to-code $mod+Shift+t exec ghostty --command tmux

# kill focused window
bindsym --to-code $mod+Shift+q kill

# start dmenu (a program launcher)
bindsym --to-code $mod+Return exec --no-startup-id "rofi -show drun"
bindsym --to-code $mod+Shift+s exec --no-startup-id "rofi -show ssh"
# A more modern dmenu replacement is rofi:
# bindcode $mod+40 exec "rofi -modi drun,run -show drun"
# There also is i3-dmenu-desktop which only displays applications shipping a
# .desktop file. It is a wrapper around dmenu, so you need that installed.
# bindcode $mod+40 exec --no-startup-id i3-dmenu-desktop

bindsym --to-code $mod+Escape exec --no-startup-id "~/.scripts/rofi/poweroff-menu"
bindsym --to-code Mod1+Shift+4 exec --no-startup-id flameshot gui

# change focus
bindsym --to-code $mod+h focus left
bindsym --to-code $mod+j focus down
bindsym --to-code $mod+k focus up
bindsym --to-code $mod+l focus right

# alternatively, you can use the cursor keys:
bindsym --to-code $mod+Left focus left
bindsym --to-code $mod+Down focus down
bindsym --to-code $mod+Up focus up
bindsym --to-code $mod+Right focus right

# move focused window
bindsym --to-code $mod+Shift+h move left
bindsym --to-code $mod+Shift+j move down
bindsym --to-code $mod+Shift+k move up
bindsym --to-code $mod+Shift+l move right

# alternatively, you can use the cursor keys:
bindsym --to-code $mod+Shift+Left move left
bindsym --to-code $mod+Shift+Down move down
bindsym --to-code $mod+Shift+Up move up
bindsym --to-code $mod+Shift+Right move right

# split in horizontal orientation
bindsym --to-code $mod+s split h

# split in vertical orientation
bindsym --to-code $mod+v split v

# enter fullscreen mode for the focused container
bindsym --to-code $mod+f fullscreen toggle

# change container layout (stacked, tabbed, toggle split)
# bindsym --to-code $mod+s layout stacking
bindsym --to-code $mod+w layout tabbed
bindsym --to-code $mod+e layout toggle split

# toggle tiling / floating
bindsym --to-code $mod+n floating toggle

# change focus between tiling / floating windows
# bindsym --to-code $mod+space focus mode_toggle

# focus the parent container
bindsym --to-code $mod+a focus parent

# focus the child container
#bindsym --to-code $mod+d focus child

set $ws1 "1"
set $ws2 "2"
set $ws3 "3"
set $ws4 "4"
set $ws5 "5"
set $ws6 "6"
set $ws7 "7"
set $ws8 "8"
set $ws9 "9"
set $ws10 "10"

# switch to workspace
bindsym --to-code --to-code $mod+1 workspace number $ws1
bindsym --to-code --to-code $mod+2 workspace number $ws2
bindsym --to-code --to-code $mod+3 workspace number $ws3
bindsym --to-code --to-code $mod+4 workspace number $ws4
bindsym --to-code --to-code $mod+5 workspace number $ws5
bindsym --to-code --to-code $mod+6 workspace number $ws6
bindsym --to-code --to-code $mod+7 workspace number $ws7
bindsym --to-code --to-code $mod+8 workspace number $ws8
bindsym --to-code --to-code $mod+9 workspace number $ws9
bindsym --to-code --to-code $mod+0 workspace number $ws10

# move focused container to workspace
bindsym --to-code --to-code $mod+Shift+1 move container to workspace number $ws1
bindsym --to-code --to-code $mod+Shift+2 move container to workspace number $ws2
bindsym --to-code --to-code $mod+Shift+3 move container to workspace number $ws3
bindsym --to-code --to-code $mod+Shift+4 move container to workspace number $ws4
bindsym --to-code --to-code $mod+Shift+5 move container to workspace number $ws5
bindsym --to-code --to-code $mod+Shift+6 move container to workspace number $ws6
bindsym --to-code --to-code $mod+Shift+7 move container to workspace number $ws7
bindsym --to-code --to-code $mod+Shift+8 move container to workspace number $ws8
bindsym --to-code --to-code $mod+Shift+9 move container to workspace number $ws9
bindsym --to-code --to-code $mod+Shift+0 move container to workspace number $ws10

# reload the configuration file
bindsym --to-code $mod+Shift+c reload
# restart i3 inplace (preserves your layout/session, can be used to upgrade i3)
bindsym --to-code $mod+Shift+r restart
# exit i3 (logs you out of your X session)
bindsym --to-code $mod+Shift+e exec "i3-nagbar -t warning -m 'You pressed the exit shortcut. Do you really want to exit i3? This will end your X session.' -B 'Yes, exit i3' 'i3-msg exit'"

# resize window (you can also use the mouse for that)
mode "resize" {
        # These bindings trigger as soon as you enter the resize mode

        # Pressing left will shrink the window’s width.
        # Pressing right will grow the window’s width.
        # Pressing up will shrink the window’s height.
        # Pressing down will grow the window’s height.
        bindsym --to-code j resize shrink width 10 px or 10 ppt
        bindsym --to-code k resize grow height 10 px or 10 ppt
        bindsym --to-code l resize shrink height 10 px or 10 ppt
        bindsym --to-code semicolon resize grow width 10 px or 10 ppt

        # same bindings, but for the arrow keys
        bindsym --to-code Left resize shrink width 10 px or 10 ppt
        bindsym --to-code Down resize grow height 10 px or 10 ppt
        bindsym --to-code Up resize shrink height 10 px or 10 ppt
        bindsym --to-code Right resize grow width 10 px or 10 ppt

        # back to normal: Enter or Escape or $mod+r
        bindsym --to-code Return mode "default"
        bindsym --to-code Escape mode "default"
        bindsym --to-code $mod+r mode "default"
}

bindsym --to-code $mod+r mode "resize"

mode "launcher" {
	bindsym --to-code m exec --no-startup-id firefox --new-window open.spotify.com
	bindsym --to-code $mod+Tab mode "default"
}

bindsym --to-code $mod+Tab mode "launcher"

# Use pactl to adjust volume in PulseAudio.
set $refresh_i3status killall -SIGUSR1 i3status
bindsym --to-code XF86AudioRaiseVolume exec --no-startup-id pactl set-sink-volume @DEFAULT_SINK@ +10% && $refresh_i3status
bindsym --to-code XF86AudioLowerVolume exec --no-startup-id pactl set-sink-volume @DEFAULT_SINK@ -10% && $refresh_i3status
bindsym --to-code XF86AudioMute exec --no-startup-id pactl set-sink-mute @DEFAULT_SINK@ toggle && $refresh_i3status
bindsym --to-code XF86AudioMicMute exec --no-startup-id pactl set-source-mute @DEFAULT_SOURCE@ toggle && $refresh_i3status
